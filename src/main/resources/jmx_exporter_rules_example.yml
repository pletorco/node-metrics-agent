lowercaseOutputName: true

includeObjectNames:
  - co.pletor.cgroup:*
  - co.pletor.node:*
  - co.pletor.proc:*
  - co.pletor.agent:*

metricCustomizers:
  # add static node metadata labels to OsInfoMetrics
  - mbeanFilter:
      domain: co.pletor.node
      properties:
        type: OsInfoMetrics
    attributesAsLabels:
      - OsRelease
      - KernelVersion
      - OsName
      - OsArch
      - EnvironmentType
      - AgentVersion
      - AgentCommitId

  # add cgroup metadata labels to cgroup memory metrics
  - mbeanFilter:
      domain: co.pletor.cgroup
      properties:
        type: MemMetrics
    attributesAsLabels:
      - CgroupVersion
      - CgroupPath

rules:
  # ============================================================================
  # Cumulative counters are exported as UNTYPED, not COUNTER, on purpose.
  # An attribute that its source cannot provide (no PSI, no cgroup, an old kernel) reports -1. The
  # Prometheus JMX exporter 1.x rejects a negative COUNTER and then fails the WHOLE scrape (HTTP
  # 500), so a single unavailable counter would hide every metric of the target. UNTYPED keeps the
  # value and the name (no "_total" suffix is appended), and rate()/increase() work on it as on a
  # counter. Alert and dashboard queries should ignore -1 (see prometheus_alerts_example.yml).
  # The agent's own counters (co.pletor.agent) are never negative and stay COUNTER.
  # ============================================================================

  # ============================================================================
  # Node Metrics Agent
  # Consolidated rules for metrics exposed by node-metrics-agent.
  # Subsections: cgroup, node, proc.
  # ============================================================================

  # ----------------------------------------------------------------------------
  # [cgroup] co.pletor.cgroup
  # Exports cgroup counters/gauges.
  # Note: CgroupVersion/CgroupPath labels are appended by metricCustomizers.
  # ============================================================================
  - pattern: 'co.pletor.cgroup<type=(.+?)(?:,(.+))?><>(CgroupCpuThrottledCount|[A-Za-z]+Total|(?:Cpu|Memory|Io)(?:Some|Full)TotalMicros|Count):'
    name: pletor_cgroup_$1_$3
    type: UNTYPED
    cache: true

  - pattern: 'co.pletor.cgroup<type=(.+?)(?:,(.+))?><>(.+):'
    name: pletor_cgroup_$1_$3
    type: GAUGE
    cache: true


  # ----------------------------------------------------------------------------
  # [node] co.pletor.node
  # Exports node counters/gauges.
  # Note: OsInfoMetrics labels are appended by metricCustomizers.
  # ============================================================================
  - pattern: 'co.pletor.node<type=(.+?)(?:,(.+))?><>(ProcessCpuTimeNanos|UptimeSeconds|SystemCpu[A-Za-z]+Ticks|CgroupCpuThrottledPeriodsTotal|CgroupCpuThrottledTimeNanosTotal|CgroupCpuUsageNanosTotal|DiskReadBytesTotal|DiskWriteBytesTotal|NetRxBytesTotal|NetTxBytesTotal|[A-Za-z]+Total|(?:Cpu|Memory|Io)(?:Some|Full)TotalMicros|Count):'
    name: pletor_node_$1_$3
    type: UNTYPED
    cache: true

  - pattern: 'co.pletor.node<type=FsMetrics, path=(.+)><>(.+):'
    name: pletor_node_fsmetrics_$2
    type: GAUGE
    labels:
      path: '$1'
    cache: true

  - pattern: 'co.pletor.node<type=(.+?)(?:,(.+))?><>(.+):'
    name: pletor_node_$1_$3
    type: GAUGE
    cache: true

  # ----------------------------------------------------------------------------
  # [proc] co.pletor.proc
  # Exports process gauges.
  # ============================================================================
  - pattern: 'co.pletor.proc<type=(.+?)(?:,(.+))?><>(IoReadBytesTotal|IoWriteBytesTotal):'
    name: pletor_proc_$1_$3
    type: UNTYPED
    cache: true

  - pattern: 'co.pletor.proc<type=(.+?)(?:,(.+))?><>(.+):'
    name: pletor_proc_$1_$3
    type: GAUGE
    cache: true

  # ----------------------------------------------------------------------------
  # [agent] co.pletor.agent
  # Exports internal telemetry pipeline counters/gauges.
  # Note: string attributes (for example, Mode, FailingTasks, StuckTasks) are intentionally excluded here.
  # ============================================================================
  - pattern: 'co.pletor.agent<type=(.+?)(?:,(.+))?><>(ProcessedCount|EnqueueCount|DequeueCount|DroppedCount|ErrorCount|SinkSuccessCount|SinkFailureCount|SinkRetryCount|ModeTransitionCount|ThrottledLoggerOverflowCount):'
    name: pletor_agent_$1_$3
    type: COUNTER
    cache: true

  - pattern: 'co.pletor.agent<type=(.+?)(?:,(.+))?><>(QueueDepth|QueueFillRatio|EndToEndLatencyMillis|MaxTaskStalenessMs|FailingTaskCount|StuckTaskCount):'
    name: pletor_agent_$1_$3
    type: GAUGE
    cache: true
