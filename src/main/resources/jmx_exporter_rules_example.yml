lowercaseOutputName: true

includeObjectNames:
  - kr.pletor.cgroup:*
  - kr.pletor.node:*
  - kr.pletor.proc:*
  - kr.pletor.agent:*

metricCustomizers:
  # add static node metadata labels to OsInfoMetrics
  - mbeanFilter:
      domain: kr.pletor.node
      properties:
        type: OsInfoMetrics
    attributesAsLabels:
      - OsRelease
      - KernelVersion
      - OsName
      - OsArch
      - EnvironmentType
      - AgentVersion
      - AgentCommitId

  # add cgroup metadata labels to cgroup memory metrics
  - mbeanFilter:
      domain: kr.pletor.cgroup
      properties:
        type: MemMetrics
    attributesAsLabels:
      - CgroupVersion
      - CgroupPath

rules:
  # ============================================================================
  # Cumulative counters are typed COUNTER, so the exporter names them "<attribute>_total" (for
  # example pletor_node_iorates_diskreadbytestotal_total).
  # A counter whose source is unavailable on this host (no PSI, no cgroup, an old kernel) is absent
  # (null over JMX) and the exporter skips it. Gauges report -1 when unavailable; filter that in
  # queries (see prometheus_alerts_example.yml). Never expose a counter as -1: the exporter 1.x
  # rejects a negative COUNTER and fails the whole scrape (HTTP 500).
  # ============================================================================

  # ============================================================================
  # Node Metrics Agent
  # Consolidated rules for metrics exposed by node-metrics-agent.
  # Subsections: cgroup, node, proc.
  # ============================================================================

  # ----------------------------------------------------------------------------
  # [cgroup] kr.pletor.cgroup
  # Exports cgroup counters/gauges.
  # Note: CgroupVersion/CgroupPath labels are appended by metricCustomizers.
  # ============================================================================
  - pattern: 'kr.pletor.cgroup<type=(.+?)(?:,(.+))?><>(CgroupCpuThrottledCount|[A-Za-z]+Total|(?:Cpu|Memory|Io)(?:Some|Full)TotalMicros|Count):'
    name: pletor_cgroup_$1_$3
    type: COUNTER
    cache: true

  - pattern: 'kr.pletor.cgroup<type=(.+?)(?:,(.+))?><>(.+):'
    name: pletor_cgroup_$1_$3
    type: GAUGE
    cache: true


  # ----------------------------------------------------------------------------
  # [node] kr.pletor.node
  # Exports node counters/gauges.
  # Note: OsInfoMetrics labels are appended by metricCustomizers.
  # ============================================================================
  - pattern: 'kr.pletor.node<type=(.+?)(?:,(.+))?><>(ProcessCpuTimeNanos|UptimeSeconds|SystemCpu[A-Za-z]+Ticks|CgroupCpuThrottledPeriodsTotal|CgroupCpuThrottledTimeNanosTotal|CgroupCpuUsageNanosTotal|DiskReadBytesTotal|DiskWriteBytesTotal|NetRxBytesTotal|NetTxBytesTotal|[A-Za-z]+Total|(?:Cpu|Memory|Io)(?:Some|Full)TotalMicros|Count):'
    name: pletor_node_$1_$3
    type: COUNTER
    cache: true

  - pattern: 'kr.pletor.node<type=FsMetrics, path=(.+)><>(.+):'
    name: pletor_node_fsmetrics_$2
    type: GAUGE
    labels:
      path: '$1'
    cache: true

  - pattern: 'kr.pletor.node<type=(.+?)(?:,(.+))?><>(.+):'
    name: pletor_node_$1_$3
    type: GAUGE
    cache: true

  # ----------------------------------------------------------------------------
  # [proc] kr.pletor.proc
  # Exports process gauges.
  # ============================================================================
  - pattern: 'kr.pletor.proc<type=(.+?)(?:,(.+))?><>(IoReadBytesTotal|IoWriteBytesTotal):'
    name: pletor_proc_$1_$3
    type: COUNTER
    cache: true

  - pattern: 'kr.pletor.proc<type=(.+?)(?:,(.+))?><>(.+):'
    name: pletor_proc_$1_$3
    type: GAUGE
    cache: true

  # ----------------------------------------------------------------------------
  # [agent] kr.pletor.agent
  # Exports internal telemetry pipeline counters/gauges.
  # Note: string attributes (for example, Mode, FailingTasks, StuckTasks) are intentionally excluded here.
  # ============================================================================
  - pattern: 'kr.pletor.agent<type=(.+?)(?:,(.+))?><>(ProcessedCount|EnqueueCount|DequeueCount|DroppedCount|ErrorCount|SinkSuccessCount|SinkFailureCount|SinkRetryCount|ModeTransitionCount|ThrottledLoggerOverflowCount):'
    name: pletor_agent_$1_$3
    type: COUNTER
    cache: true

  - pattern: 'kr.pletor.agent<type=(.+?)(?:,(.+))?><>(QueueDepth|QueueFillRatio|EndToEndLatencyMillis|MaxTaskStalenessMs|FailingTaskCount|StuckTaskCount):'
    name: pletor_agent_$1_$3
    type: GAUGE
    cache: true
