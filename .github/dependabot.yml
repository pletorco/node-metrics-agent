version: 2

updates:
  # GitHub Actions are referenced by tag; Dependabot proposes updates as they are released.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Gradle plugins and dependencies declared in build.gradle.kts, plus the wrapper.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # JUnit 6+ requires Java 17; the full test suite must also run on Java 11.
      # Continue receiving compatible JUnit 5 updates.
      - dependency-name: "org.junit:junit-bom"
        versions: [">=6.0.0"]
