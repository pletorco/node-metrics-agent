name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, unit tests and style checks on the build JDK.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and lint
        run: ./gradlew --no-daemon test checkstyleMain checkstyleTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/checkstyle

  # The agent targets Java 11+ (Kafka brokers), so run the tests on the older runtimes too.
  test-jdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDKs (build JDK last so it stays JAVA_HOME)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
          cache: gradle

      - name: Test on Java ${{ matrix.java }}
        run: >
          ./gradlew --no-daemon test
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: build/reports/tests/test

  # Build the shaded jar once...
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build shaded jar
        run: ./gradlew --no-daemon shadowJar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: agent-jar
          path: build/libs/*-all.jar
          if-no-files-found: error

  # ...and run it as a real -javaagent on each supported runtime.
  smoke:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: agent-jar
          path: dist

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Smoke test on Java ${{ matrix.java }}
        run: scripts/smoke-test.sh dist/*-all.jar
