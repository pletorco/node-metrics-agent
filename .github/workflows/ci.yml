name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always emit this stable required check, including docs-only and fork PRs.
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout candidate merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          check-latest: true
          cache: gradle

      - name: Gate runtime and tooling dependencies
        uses: ./.github/actions/security-gate
        with:
          context: pr
          token: ${{ github.token }}

  # Build, unit tests and style checks on the build JDK.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          check-latest: true
          cache: gradle

      - name: Test and lint
        run: ./gradlew --no-daemon spotlessCheck test checkstyleMain checkstyleTest jacocoTestCoverageVerification

      - name: Test security scanner failure handling
        run: python3 -m unittest discover -s scripts/tests -v

      # The release workflow publishes this CHANGELOG.md section as the release notes; catch a
      # version bump without one here instead of when the tag is pushed.
      - name: Check the release notes for the project version
        run: scripts/release-notes.sh "$(./gradlew -q --no-daemon printVersion | tr -d '\r')" > /dev/null

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/checkstyle
            build/reports/jacoco/test
            build/reports/jacocoHtml

  # The agent targets Java 11+ (Kafka brokers), so run the tests on the older runtimes too.
  test-jdk:
    name: test-jdk (${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Temurin 11's November CSPU is not published yet; use the patched Microsoft build.
          - java: "11"
            distribution: microsoft
            version: "11.0.33.1"
          - java: "17"
            distribution: temurin
            version: "17.0.21.1+2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up patched test JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.version }}
          check-latest: true

      - name: Set up patched build JDK (last so it stays JAVA_HOME)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          check-latest: true
          cache: gradle

      - name: Test on Java ${{ matrix.java }}
        run: >
          ./gradlew --no-daemon test
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: build/reports/tests/test

  # Build the shaded jar once...
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          check-latest: true
          cache: gradle

      - name: Build shaded jar
        run: ./gradlew --no-daemon shadowJar

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: agent-jar
          path: build/libs/*-all.jar
          if-no-files-found: error

  # ...and run it as a real -javaagent on each supported runtime.
  smoke:
    name: smoke (${{ matrix.java }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "11"
            distribution: microsoft
            version: "11.0.33.1"
          - java: "17"
            distribution: temurin
            version: "17.0.21.1+2"
          - java: "21"
            distribution: temurin
            version: "21.0.13.1+2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: agent-jar
          path: dist

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.version }}
          check-latest: true

      - name: Smoke test on Java ${{ matrix.java }}
        run: scripts/smoke-test.sh dist/*-all.jar

  # ...and scrape it through real Prometheus JMX exporters: an exporter can fail the whole scrape on
  # what the agent exposes (a negative counter, a null value next to attributesAsLabels), which no
  # unit test can show. The jars are pinned by SHA-256.
  exporter:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - exporter: "1.0.1"
            url: https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.0.1/jmx_prometheus_javaagent-1.0.1.jar
            sha256: 7d61f737fd661610ccc14aea79764faa1ea94a340cbc8f0029b3d2edea3d80c1
          - exporter: "1.6.0"
            url: https://github.com/prometheus/jmx_exporter/releases/download/1.6.0/jmx_prometheus_javaagent-1.6.0.jar
            sha256: a95983fd96e865d2bcdf911cc500e7c82808c27ab9fd226bf96732b6c3d8c46e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: agent-jar
          path: dist

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17.0.21.1+2"
          check-latest: true

      - name: Download JMX exporter ${{ matrix.exporter }}
        run: |
          curl -fsSL --retry 3 -o exporter.jar "${{ matrix.url }}"
          echo "${{ matrix.sha256 }}  exporter.jar" | sha256sum -c -

      - name: Scrape through JMX exporter ${{ matrix.exporter }}
        run: scripts/exporter-scrape-test.sh dist/*-all.jar exporter.jar

      - name: Verify cgroup migration labels through the exporter
        if: matrix.exporter == '1.6.0'
        run: python3 scripts/cgroup_migration_check.py --agent-jar dist/*-all.jar --exporter-jar exporter.jar
