name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, unit tests and style checks on the build JDK.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and lint
        run: ./gradlew --no-daemon spotlessCheck test checkstyleMain checkstyleTest

      # The release workflow publishes this CHANGELOG.md section as the release notes; catch a
      # version bump without one here instead of when the tag is pushed.
      - name: Check the release notes for the project version
        run: scripts/release-notes.sh "$(./gradlew -q --no-daemon printVersion | tr -d '\r')" > /dev/null

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/checkstyle

  # The agent targets Java 11+ (Kafka brokers), so run the tests on the older runtimes too.
  test-jdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDKs (build JDK last so it stays JAVA_HOME)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
          cache: gradle

      - name: Test on Java ${{ matrix.java }}
        run: >
          ./gradlew --no-daemon test
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: build/reports/tests/test

  # Build the shaded jar once...
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build shaded jar
        run: ./gradlew --no-daemon shadowJar

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: agent-jar
          path: build/libs/*-all.jar
          if-no-files-found: error

  # ...and run it as a real -javaagent on each supported runtime.
  smoke:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: agent-jar
          path: dist

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Smoke test on Java ${{ matrix.java }}
        run: scripts/smoke-test.sh dist/*-all.jar

  # ...and scrape it through real Prometheus JMX exporters: an exporter can fail the whole scrape on
  # what the agent exposes (a negative counter, a null value next to attributesAsLabels), which no
  # unit test can show. The jars are pinned by SHA-256.
  exporter:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - exporter: "1.0.1"
            url: https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.0.1/jmx_prometheus_javaagent-1.0.1.jar
            sha256: 7d61f737fd661610ccc14aea79764faa1ea94a340cbc8f0029b3d2edea3d80c1
          - exporter: "1.6.0"
            url: https://github.com/prometheus/jmx_exporter/releases/download/1.6.0/jmx_prometheus_javaagent-1.6.0.jar
            sha256: a95983fd96e865d2bcdf911cc500e7c82808c27ab9fd226bf96732b6c3d8c46e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: agent-jar
          path: dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download JMX exporter ${{ matrix.exporter }}
        run: |
          curl -fsSL --retry 3 -o exporter.jar "${{ matrix.url }}"
          echo "${{ matrix.sha256 }}  exporter.jar" | sha256sum -c -

      - name: Scrape through JMX exporter ${{ matrix.exporter }}
        run: scripts/exporter-scrape-test.sh dist/*-all.jar exporter.jar
