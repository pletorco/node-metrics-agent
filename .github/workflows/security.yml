name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Generate runtime and tooling inventories and scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon trivyScanAll

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            build/reports/security/
            build/reports/bom.json
