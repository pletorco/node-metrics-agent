name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

env:
  # Review scanner upgrades explicitly; new stable releases create a deduplicated issue.
  TRIVY_VERSION: "v0.76.2"

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Generate runtime and tooling inventories and scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon trivyScanAll

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            build/reports/security/
            build/reports/bom.json

  scanner-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: security-scanner-update-notifications
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check stable Trivy releases and notify once per version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 scripts/security_tool_updates.py
          --repository "$GITHUB_REPOSITORY"
          --current-version "$TRIVY_VERSION"
          --output build/reports/security-tool-updates.json

      - name: Upload scanner update check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-tool-updates
          path: build/reports/security-tool-updates.json
