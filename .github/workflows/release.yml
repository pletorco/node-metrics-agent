name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Fail fast, before spending time on the build.
      - name: Verify tag matches project version
        run: |
          VERSION="$(./gradlew -q --no-daemon printVersion | tr -d '\r')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Test, lint and build distribution
        run: ./gradlew --no-daemon clean check shadowJar cyclonedxBom

      - name: Smoke test the release jar
        run: scripts/smoke-test.sh build/libs/*-all.jar

      - name: Write checksums
        run: |
          cd build/libs
          sha256sum -- *-all.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/libs/*-all.jar
            build/libs/SHA256SUMS
            build/reports/bom.json

      - name: Keep the jar for the optional provenance job
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: build/libs/*-all.jar
          if-no-files-found: error

  # Optional: signed build provenance for the released jar, in its own job so that the OIDC and
  # attestation permissions are granted only when it runs. Off by default because attestations
  # need repository support (public repositories, or plans with attestations enabled). Enable it
  # with a repository variable: Settings > Secrets and variables > Actions > Variables >
  # ATTEST_RELEASE_ARTIFACTS = true.
  # Verify a download with: gh attestation verify <jar> --repo <owner>/<repo>
  attest:
    needs: release
    if: ${{ vars.ATTEST_RELEASE_ARTIFACTS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: release-jar
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*-all.jar
